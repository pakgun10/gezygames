server {
    listen 80;
    listen [::]:80;
    server_name games.gezytech.web.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name games.gezytech.web.id;

    root /home/ubuntu/gezygames/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/games.gezytech.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.gezytech.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GEZYGAMES_TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; media-src 'self' blob:" always;

    location ~* ^/(?:assets|math-archer/assets)/.+\.(?:css|js|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location = /math-archer/index.html {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/gezygames.access.log;
    error_log /var/log/nginx/gezygames.error.log warn;
}

