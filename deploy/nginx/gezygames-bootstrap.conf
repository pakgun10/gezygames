# Temporary HTTP-only configuration used to issue the first TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name games.gezytech.web.id;

    root /home/ubuntu/gezygames/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

